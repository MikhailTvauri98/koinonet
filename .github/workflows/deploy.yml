name: deploy

# Выкладка на сервер при каждом пуше в main (docs/architecture.md, раздел 11).
# Настройка сервера и секретов репозитория — docs/deploy.md.
#
# CI входит в этот же запуск (ci.yml как вызываемый workflow), и выкладка
# ждёт всех его заданий: api, web, e2e. Проверенный и выложенный коммит один и
# тот же — github.sha этого запуска. Сам ci.yml на пуши в main не запускается,
# чтобы не гонять его дважды. Почему не `on: workflow_run`: тот запускается в
# контексте main с токеном на запись и на завершение любого прогона ci,
# включая pull request; выкладывать пришлось бы отдельно переданный head_sha,
# а прогоны ci разных коммитов могут закончиться не по порядку, и старый
# коммит выкатился бы поверх нового.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Запуски идут по одному, в порядке пушей: следующий ждёт окончания
# предыдущего, а ожидающий заменяется более новым, так что старый коммит
# никогда не выкатывается поверх нового.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: ci
    # Первая установка: CI работает сразу, выкладку включают после DNS/TLS.
    if: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Публикация образов в GHCR; тем же токеном сервер их скачивает.
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR принимает имена образов только в нижнем регистре, а в имени
      # репозитория GitHub бывают заглавные буквы.
      - name: Image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Действия docker/* работают с токеном, который может публиковать
      # образы, поэтому закреплены на коммитах: подменённый тег не подложит
      # образ под тем тегом, который скачает сервер.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Кеш слоёв в кеше GitHub Actions: без него каждая сборка заново
      # компилирует расширения PHP, слой получает новый дайджест, и сервер
      # скачивает и хранит его заново на каждом деплое.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/php/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.image.outputs.prefix }}/app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/web/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.prefix }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # SSH и scp из образа раннера, без стороннего действия: ключ сервера не
      # попадает в чужой код. appleboy/ssh-action, закреплённый даже на SHA,
      # при запуске скачивает бинарник drone-ssh с GitHub Releases без
      # проверки контрольной суммы. Ключ хоста сверяется с DEPLOY_KNOWN_HOSTS.
      - name: SSH access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo 'Host deploy-target'
            printf '  HostName %s\n  User %s\n' "$DEPLOY_HOST" "$DEPLOY_USER"
            echo '  IdentityFile ~/.ssh/deploy_key'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
            echo '  BatchMode yes'
          } > ~/.ssh/config

      - name: Deploy
        id: deploy
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scp infra/compose.prod.yml infra/deploy.sh deploy-target:/srv/church/
          # Сервер скачивает образы токеном этого запуска: постоянного пароля
          # от GHCR на сервере нет, токен перестаёт действовать с концом задания.
          printf '%s' "$REGISTRY_TOKEN" \
            | ssh deploy-target docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          ssh -n deploy-target "TAG=$GITHUB_SHA sh /srv/church/deploy.sh"

      - name: Registry logout on the server
        if: always() && steps.deploy.conclusion != 'skipped'
        run: ssh -n deploy-target docker logout ghcr.io
