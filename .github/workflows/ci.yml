name: ci

# Пуши в main проверяет deploy.yml: он вызывает этот workflow и выкладывает
# коммит только после всех его заданий.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

# Заданиям нужно только читать код. Из deploy.yml права могут лишь сужаться.
permissions:
  contents: read

# Новый пуш в ветку или pull request отменяет его устаревший прогон. Прогоны
# из deploy.yml (ref main) не отменяются: каждый выкладываемый коммит
# проверяется целиком, а очередь выкладок держит сам deploy.yml.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    runs-on: ubuntu-latest
    # Задание работает на самом раннере, а не в контейнере сети Compose,
    # поэтому сервисы ниже доступны на localhost (порты проброшены), а не по
    # имени сервиса. Переменные — на уровне задания: их видят и Pest, и экспорт
    # OpenAPI (Scramble читает схему таблиц из базы). У DB_* в phpunit.xml нет
    # force="true", поэтому настоящая переменная окружения сильнее его
    # умолчания sqlite — так же, как окружение контейнера в infra/compose.yml
    # для `docker compose exec app`.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: church_test
      DB_USERNAME: church
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: array
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: church_test
          POSTGRES_USER: church
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      # Стороннее действие закреплено на коммите: подменённый тег не выполнит
      # чужой код в прогоне.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, imagick, bcmath, zip, exif, gd
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer lint
      - run: composer types
      # --ci: забытый ->only() не сужает прогон до одного теста.
      - run: composer run --timeout=0 test -- --ci
      - name: OpenAPI schema is up to date
        # Фиксированный адрес схемы, независимо от dev .env и порта Compose.
        env:
          APP_URL: http://localhost:8000
        run: composer openapi && git diff --exit-code openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - name: Generated types are up to date
        run: git diff --exit-code types/api.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Продакшен по архитектуре — статика `nuxt generate` за nginx
      # (docs/architecture.md, разделы 10-11; образ infra/web/Dockerfile
      # собирает её той же командой), а не Node-сервер из `npm run build`
      # выше: тот нужен только сквозным тестам (`nuxt preview`). Собранный
      # service worker (injectManifest) зависит от того, какие файлы реально
      # оказались в public/, а это отличается между двумя командами: у
      # `npm run build` в public/ нет ни одной HTML-оболочки, ключ '/' есть
      # только у `generate`. Поэтому service worker проверяется на статике.
      - run: npm run generate
      - name: Service worker survives execution
        run: npm run verify-sw

  # Сквозные сценарии Playwright (apps/web/e2e). Та же команда `npm run e2e`,
  # что и локально; различие окружений — только E2E_API_RUNTIME (см.
  # apps/web/e2e/environment.ts): здесь PHP стоит на раннере, а Postgres и
  # Redis — сервисы задания, как в задании api.
  e2e:
    needs: [api, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_USER: church
          # Прикладной базы здесь нет: `church_e2e` создаёт подготовка
          # сквозных тестов (migrate:fresh), как и локально.
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      E2E_API_RUNTIME: native
      # Подключение для процессов API; базу и номера баз Redis сквозных
      # тестов задаёт сама их конфигурация (apps/web/e2e/environment.ts).
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: church
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, imagick, bcmath, zip, exif, gd
      - run: composer install --no-interaction --prefer-dist
        working-directory: apps/api
      - run: cp .env.example .env && php artisan key:generate
        working-directory: apps/api
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      # Только Chromium и его системные зависимости, не весь набор браузеров.
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
        working-directory: apps/web
      - name: Traces, screenshots and API logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
