name: ci

on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: church_test
          POSTGRES_USER: church
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, imagick, bcmath, zip, exif, gd
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer lint
      - run: composer types
      - run: composer test
        env:
          # The job runs on the runner itself, not inside a container on the
          # compose network, so these services are reachable at localhost
          # (ports mapped above), not by service name. phpunit.xml's DB_*
          # env vars have no force="true", so a real env var here beats its
          # sqlite default, same as infra/compose.yml's container env
          # already does for `docker compose exec app`.
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: church_test
          DB_USERNAME: church
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: redis
      - name: OpenAPI schema is up to date
        run: composer openapi && git diff --exit-code openapi.json
