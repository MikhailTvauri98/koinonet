  if(a==='demo-remove'){close();toast('Демонстрация завершена. Состав не изменён.');return}
  if(a==='group-chat'){state.chat='group';state.chatOpen=true;go('chats');return}if(a==='chat-back'){state.chatOpen=false;render();if(root.clientWidth>700)screen.querySelector('.cc-conversation').innerHTML='<div class="cc-empty" style="margin:auto">Выберите чат слева<br><button class="cc-link" data-action="new-message">Написать человеку</button></div>';return}
  if(a==='chat-menu'){chatMenu();return}if(a==='mute'){mute();return}if(a==='chat-info'){if(state.chat==='group')modal('Участники чата','<p class="cc-muted">Состав автоматически повторяет состав служения.</p>'+people.map((p,i)=>'<button class="cc-choice" data-person="'+i+'">'+avatar(p)+'<span class="cc-person-text"><strong>'+p[0]+'</strong><small>'+p[1]+'</small></span>'+icon('chevron-right')+'</button>').join(''));else modal('О человеке','<div class="cc-detail-head">'+avatar([state.chat,'',state.chat.split(' ').map(x=>x[0]).join('')],true)+'<h2>'+esc(state.chat)+'</h2></div><p class="cc-muted">Личный чат</p>');return}
  if(a==='edit-template'){go('editor');return}if(a==='templates'){go('templates');return}if(a==='read-all'){state.read=true;render();toast('Все уведомления прочитаны.');return}if(a==='notification-settings'){state.settings='alerts';go('profile');return}
  if(a==='ministry-events'||a==='notice-detail'){modal('Воскресное событие','<p class="cc-muted">8 ноября · 10:00–12:00 · Главный зал</p><hr class="cc-divider"><h3>Подготовка зала</h3><p style="margin-top:8px">Вы назначены на событие. Время показано по Москве.</p>');return}
  if(a==='attachment'){modal('Добавить вложение','<label class="cc-field">Изображение или документ<input type="file"></label>');return}if(a==='photo'){modal('Фото человека','<label class="cc-field">Выберите фото<input type="file" accept="image/*"></label>');return}if(a==='end-session'){modal('Завершить сессию iPhone?','<p>На этом устройстве потребуется снова войти.</p>','<div class="cc-modal-footer">'+button('Отмена','close')+button('Завершить','demo-end')+'</div>');return}if(a==='demo-end'){close();toast('Пример подтверждения завершения сессии.');return}
 });
 root.addEventListener('input',e=>{const input=e.target;const id=input.id;const q=input.value?.toLocaleLowerCase('ru').trim();if(id==='cc-member-search'||id==='cc-picker-search'||id==='cc-chat-search'){const selector=id==='cc-member-search'?'[data-person-name]':id==='cc-picker-search'?'[data-choice]':'[data-chat]';let count=0;root.querySelectorAll(selector).forEach(row=>{row.hidden=!(row.dataset.personName||row.dataset.name).toLocaleLowerCase('ru').includes(q);if(!row.hidden)count++});const empty=root.querySelector(id==='cc-member-search'?'#cc-no-members':'#cc-no-options');if(empty)empty.hidden=count>0;}});
 function demoSubmit(form){if(form.id==='cc-composer'){const input=form.querySelector('textarea');if(!input.value.trim())return;state.sent.push({chat:state.chat,text:input.value.trim()});render();screen.querySelector('textarea').focus()}else toast('Сохранено в демонстрации. Данные сайта не меняются.');}
 root.addEventListener('submit',e=>{e.preventDefault();demoSubmit(e.target)});
 restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState&&restore(e.detail.globals.widgetState))render()});
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:paintTheme});tweak.addSlider(design,'radius',{label:'Скругление поверхностей',min:6,max:20,unit:'px'});tweak.addSlider(design,'row',{label:'Высота строки участника',min:64,max:88,unit:'px'});}
})();
