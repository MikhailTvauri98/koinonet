function render(){if(state.screen==='calendar')calendar();else if(state.screen==='detail')detail();else if(state.screen==='create'||state.screen==='edit')form();if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});}
function calendar(){const month=fmt(state.date,{month:'long',year:'numeric'}).replace(' г.',''),view=state.view||(root.clientWidth>=1024?'month':'list');
content.innerHTML=`<div class="cal-heading"><div><h1>Календарь</h1><p>События церкви и ваши назначения</p></div>${button(icon('plus')+'Создать событие','create','cal-primary')}</div><div class="cal-bar"><div class="cal-period"><h2>${month}</h2><button class="cal-button cal-icon cursor-interaction" data-action="prev" aria-label="Предыдущий месяц">‹</button><button class="cal-button cal-icon cursor-interaction" data-action="next" aria-label="Следующий месяц">›</button></div>${button('Сегодня','today')}<input class="cal-date" id="cal-jump" aria-label="Перейти к дате" type="date" value="${state.date}"><div class="cal-segment cal-right" aria-label="Область календаря"><button type="button" data-scope="all" aria-pressed="${state.scope==='all'}">Все</button><button type="button" data-scope="mine" aria-pressed="${state.scope==='mine'}">Мои</button></div><div class="cal-segment cal-views" aria-label="Вид календаря"><button type="button" data-view="month" aria-pressed="${view==='month'}">Месяц</button><button type="button" data-view="list" aria-pressed="${view==='list'}">Список</button></div></div><div class="cal-muted" style="margin-bottom:16px">Время церкви · Москва (UTC+3)${state.scope==='mine'?' · Только ваши назначения':''}</div><div id="cal-results" aria-live="polite"></div>`;
const results=content.querySelector('#cal-results');
if(view==='month') {const first=parse(state.date.slice(0,7)+'-01'),start=new Date(first);start.setUTCDate(1-((first.getUTCDay()+6)%7));const last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)),count=Math.ceil((((first.getUTCDay()+6)%7)+last.getUTCDate())/7)*7;results.classList.add('cal-monthlayout');let html='<div class="cal-grid">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="cal-weekday">${x}</div>`).join('');for(let i=0;i<count;i++){const d=new Date(start);d.setUTCDate(d.getUTCDate()+i);const key=iso(d),dayEvents=onDay(key);html+=`<div class="cal-day ${key.slice(0,7)!==state.date.slice(0,7)?'outside':''} ${key===state.date?'chosen':''}"><button type="button" class="cal-daynum cursor-interaction ${key==='2026-11-01'?'today':''}" data-day="${key}" aria-label="${long(key)}" aria-pressed="${key===state.date}">${d.getUTCDate()}<small class="cal-mobilecount">${dayEvents.length?dayEvents.length+' соб.':''}</small></button>${dayEvents.slice(0,1).map(e=>`<button type="button" data-open="${e.id}" class="cal-event cursor-interaction ${e.mine?'mine':''} ${e.cancelled?'cancelled':''}" data-tooltip="${esc(e.title)}"><span>${key===e.date?e.time:'До '+e.end}</span> ${esc(e.title)}${e.date!==e.endDate?' · '+(key===e.date?'начало':'окончание'):''}${e.cancelled?' · Отменено':''}</button>`).join('')}${dayEvents.length>1?`<button type="button" class="cal-more cursor-interaction" data-more="${key}">Ещё ${dayEvents.length-1}</button>`:''}</div>`;}results.innerHTML=html+'</div>'+dayPanel(state.date);}
else {let html=dayPanel(state.date);const month=state.date.slice(0,7),days=[...new Set(events.filter(e=>(e.date.startsWith(month)||e.endDate.startsWith(month))&&(state.scope==='all'||e.mine)).flatMap(e=>e.date===e.endDate?[e.date]:[e.date,e.endDate]))].filter(d=>d>state.date&&d.startsWith(month)).sort();html+=days.map(d=>`<h3 class="cal-groupdate">${long(d)}</h3><div class="cal-list">${onDay(d).map(e=>eventRow(e,d)).join('')}</div>`).join('');results.innerHTML=html;}
}
function dayPanel(d){return `<section id="cal-selected"><div class="cal-selection"><h2>${long(d)}</h2>${button(icon('plus')+'Создать на '+fmt(d,{day:'numeric',month:'long'}),'create')}</div><div class="cal-list">${onDay(d).map(e=>eventRow(e,d)).join('')||'<p class="cal-empty">На этот день событий нет</p>'}</div></section>`;}
function detail(){const e=state.event;content.innerHTML=`${button(icon('arrow-left')+'К календарю','back','cal-back')}<div class="cal-heading"><div><p>${esc(e.owner)}</p><h1>${esc(e.title)}</h1></div>${button(icon('pencil')+'Изменить','edit')}</div>${e.cancelled?'<div class="cal-summary">Событие отменено · Изменились планы служения</div>':e.mine?'<div class="cal-summary"><div><strong>Вы назначены</strong>Вокал · Музыкальное служение</div><span>Подготовка к 09:30</span></div>':''}<div class="cal-detailgrid"><section class="cal-panel"><h2>О событии</h2><div class="cal-meta"><div><small>Дата и время · Москва (UTC+3)</small>${long(e.date)}, ${e.time} — ${e.endDate!==e.date?long(e.endDate)+', ':''}${e.end}</div><div><small>Место</small>${esc(e.place)}</div><div><small>Описание</small>Собираемся вместе для молитвы и прославления. Подготовка зала и проверка звука — за полчаса до начала.</div></div><h2 class="cal-sectiongap">Слоты и назначения</h2><div class="cal-slot"><div class="cal-slothead"><h3>Вокал</h3><span class="cal-tag">1 из 3</span></div><p>Музыкальное служение · Свободно: 2</p><div class="cal-people"><span class="cal-avatar">АП</span><span>Анна Петрова · вы</span>${button('Назначить','assign-vocal')}</div></div><div class="cal-slot"><div class="cal-slothead"><h3>Звук</h3><span class="cal-muted">1 из 1</span></div><p>Музыкальное служение</p><div class="cal-people"><span class="cal-avatar">ДК</span><span>Даниил Ким</span></div></div><div class="cal-slot"><div class="cal-slothead"><h3>Помощь с подготовкой</h3><span class="cal-muted">0 из 2</span></div><p>Свободный слот · Свободно: 2</p>${button('Назначить','assign-free')}</div><div id="cal-assign" hidden></div></section><aside class="cal-panel"><h2>Подробности</h2><div class="cal-meta"><div><small>Видимость</small>Вся церковь</div><div><small>Напоминания назначенным</small>За 24 часа и за 2 часа</div><div><small>Вложения</small>Вложений нет</div></div><div class="cal-detailfoot">${button(icon('messages-square')+'Открыть чат','chat')}</div></aside></div><div class="cal-detailfoot">${button('Отменить событие','cancel-event','cal-danger')}</div>`;}
function form(){const editing=state.screen==='edit',e=editing?state.event:null;content.innerHTML=`${button(icon('arrow-left')+(editing?'К событию':'К календарю'),'leave-form','cal-back')}<div class="cal-heading"><div><h1>${editing?'Редактирование события':'Новое событие'}</h1><p>${long(e?.date||state.date)} · время церкви, Москва (UTC+3)</p></div><button type="submit" form="cal-form" class="cal-button cal-primary cal-quicksubmit cursor-interaction">${editing?'Сохранить изменения':'Создать событие'}</button></div><form id="cal-form"><div class="cal-formgrid"><div><section class="cal-panel"><h2>О событии</h2><div class="cal-fields"><label class="cal-field">Название события<input name="title" required placeholder="Например, молитвенный вечер" value="${esc(e?.title||'')}"></label><label class="cal-field">Место<input name="place" placeholder="Зал или адрес" value="${esc(e?.place||'')}"></label><label class="cal-field">Описание<textarea name="description" placeholder="Что важно знать назначенным"></textarea></label><label class="cal-field">Владелец события<select name="owner"><option>Церковь</option><option>Музыкальное служение</option></select></label></div></section><section class="cal-panel cal-sectiongap"><h2>Видимость и уведомление</h2><div class="cal-fields"><label class="cal-field">Кто видит событие<select><option>Вся церковь</option><option>Только назначенные</option></select></label><label class="cal-check"><input type="checkbox" name="notify">Уведомить всех о новом событии</label></div></section></div><div><section class="cal-panel"><h2>Дата и время</h2><div class="cal-fields"><div class="cal-pair"><label class="cal-field">Дата начала<input type="date" name="date" required value="${e?.date||state.date}"></label><label class="cal-field">Время начала<input type="time" name="time" required value="${e?.time||''}"></label></div><div class="cal-pair"><label class="cal-field">Дата окончания<input type="date" name="endDate" required value="${e?.endDate||state.date}"></label><label class="cal-field">Время окончания<input type="time" name="end" required value="${e?.end||''}" aria-describedby="cal-time-error"></label></div><p id="cal-duration" class="cal-muted">Выберите время начала и окончания</p><p id="cal-time-error" class="cal-error" role="alert"></p></div></section><section class="cal-panel cal-sectiongap"><h2>Слоты</h2><p class="cal-muted" id="cal-slotform">Слотов пока нет. Их можно добавить сейчас или позже.</p><div class="cal-sectiongap">${button(icon('plus')+'Добавить слот','add-slot')}</div></section><section class="cal-panel cal-sectiongap"><h2>Вложения</h2><label class="cal-field">Прикрепить медиафайлы<input type="file" multiple></label></section></div></div><div class="cal-actions"><span class="cal-notice">Демонстрация: данные остаются только в примере</span>${button('Отменить редактирование','leave-form')}<button type="submit" class="cal-button cal-primary cursor-interaction">${editing?'Сохранить изменения':'Создать событие'}</button></div><div id="cal-leave" hidden></div></form>`;
const f=content.querySelector('form');f.addEventListener('input',()=>{const d=new FormData(f),start=d.get('date')+'T'+d.get('time'),end=d.get('endDate')+'T'+d.get('end'),minutes=(new Date(end)-new Date(start))/60000;content.querySelector('#cal-duration').textContent=Number.isFinite(minutes)&&minutes>0?'Длительность: '+Math.floor(minutes/60)+' ч '+minutes%60+' мин':'Выберите время начала и окончания';content.querySelector('#cal-time-error').textContent=Number.isFinite(minutes)&&minutes<=0?'Окончание должно быть позже начала. Проверьте дату и время.':'';});f.addEventListener('submit',ev=>{ev.preventDefault();const d=new FormData(f);if(d.get('endDate')+'T'+d.get('end')<=d.get('date')+'T'+d.get('time')){content.querySelector('#cal-time-error').textContent='Окончание должно быть позже начала. Проверьте дату и время.';f.elements.end.focus();return;}const item={id:e?.id||'demo-'+Date.now(),date:d.get('date'),endDate:d.get('endDate'),time:d.get('time'),end:d.get('end'),title:d.get('title'),place:d.get('place')||'Не указано',owner:d.get('owner')};if(e)Object.assign(e,item);else events.push(item);state.event=e||item;state.screen='detail';render();content.scrollIntoView({block:'start'});persist();});}
root.querySelector('#cal-theme').addEventListener('change',ev=>root.dataset.theme=ev.target.value);
root.addEventListener('change',ev=>{if(ev.target.id==='cal-jump'&&ev.target.value){state.date=ev.target.value;render();persist();}});
root.addEventListener('click',ev=>{const el=ev.target.closest('button');if(!el)return;if(el.dataset.open){state.event=events.find(e=>e.id===el.dataset.open);state.screen='detail';render();content.scrollIntoView({block:'start'});}else if(el.dataset.scope){state.scope=el.dataset.scope;render();}else if(el.dataset.view){state.view=el.dataset.view;render();}else if(el.dataset.day||el.dataset.more){state.date=el.dataset.day||el.dataset.more;render();content.querySelector('#cal-selected').scrollIntoView({block:'nearest'});}else{const a=el.dataset.action;if(a==='prev'||a==='next'){const d=parse(state.date);d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+(a==='next'?1:-1));state.date=iso(d);render();}if(a==='today'){state.date='2026-11-01';render();}if(a==='back'){state.screen='calendar';render();}if(a==='create'||a==='edit'){state.screen=a;render();content.scrollIntoView({block:'start'});}if(a==='leave-form'){const f=content.querySelector('form');if(f&&[...f.querySelectorAll('input,textarea')].some(x=>x.value!==x.defaultValue)){const leave=content.querySelector('#cal-leave');leave.hidden=false;leave.innerHTML='<div class="cal-summary cal-sectiongap"><span>Выйти без сохранения изменений?</span>'+button('Продолжить редактирование','stay')+button('Выйти без сохранения','discard','cal-danger')+'</div>';leave.scrollIntoView({block:'nearest'});}else{state.screen=state.event&&state.screen==='edit'?'detail':'calendar';render();}}if(a==='stay')content.querySelector('#cal-leave').hidden=true;if(a==='discard'){state.screen=state.screen==='edit'?'detail':'calendar';render();}if(a==='add-slot'){content.querySelector('#cal-slotform').innerHTML='<div class="cal-fields"><label class="cal-field">Подпись свободного слота<input placeholder="Например, помощь с подготовкой"></label><label class="cal-field">Количество<input type="number" min="1" value="2"></label></div>';}if(a?.startsWith('assign-')){const box=content.querySelector('#cal-assign');box.hidden=false;box.innerHTML='<div class="cal-summary"><span>Назначение в слот · демонстрация выбора</span></div><label class="cal-field">Найти человека<input id="cal-candidate-search" placeholder="Имя или фамилия"></label><div id="cal-candidates" class="cal-sectiongap">'+candidateRows()+'</div>';box.querySelector('input').addEventListener('input',e=>{const q=e.target.value.trim();box.querySelector('#cal-candidates').innerHTML=q.length===1?'<p class="cal-muted">Введите хотя бы два символа</p>':candidateRows(q);});box.scrollIntoView({block:'nearest'});}if(a==='choose-candidate'){content.querySelector('#cal-assign').innerHTML='<div class="cal-summary" role="status">Назначение показано в примере. Рабочие данные не изменены.</div>';}if(a==='chat'||a==='cancel-event'){el.insertAdjacentHTML('afterend','<p class="cal-muted" role="status">Демонстрация интерфейса: это действие здесь не отправляется.</p>');}}
persist();if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});});
function candidateRows(q=''){return [{name:'Мария Волкова',detail:'Вокал · Есть пересечение: репетиция, 11:00–12:00'},{name:'Елена Соколова',detail:'Пересечений нет'}].filter(x=>x.name.toLowerCase().includes(q.toLowerCase())).map(x=>`<div class="cal-row"><div class="cal-rowtext"><strong>${x.name}</strong><small>${x.detail}</small></div>${button('Назначить','choose-candidate')}</div>`).join('')||'<p class="cal-muted">Никого не найдено</p>';}
let prevWidth=root.clientWidth;new ResizeObserver(()=>{const width=root.clientWidth;if((width>=1024)!==(prevWidth>=1024)&&!state.view&&state.screen==='calendar')render();prevWidth=width;}).observe(root);render();
})();
</script>
</div>
