# Продовый nginx (docs/architecture.md, раздел 11; сертификат и первый запуск —
# docs/deploy.md). Файл — шаблон: при старте контейнера образ nginx подставляет
# ${APP_DOMAIN} из окружения и кладёт результат в /etc/nginx/conf.d/.
# Подставляется только эта переменная (NGINX_ENVSUBST_FILTER в
# infra/web/Dockerfile); переменные nginx вроде $uri остаются как есть.

server_tokens off;

# Контейнер app пересоздаётся при каждом деплое и может получить новый адрес.
# fastcgi_pass с переменной разрешает имя через DNS Docker при запросе, а не
# один раз при старте: web не держит устаревший адрес и стартует, даже если
# app ещё не поднят.
resolver 127.0.0.11 valid=10s ipv6=off;

# Запросы на чужие имена и по IP-адресу не обслуживаются.
server {
    listen 80 default_server;
    return 444;
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

# HTTP: только проверки Let's Encrypt при продлении сертификата (certbot пишет
# файлы проверки в общий том) и перенаправление на HTTPS.
server {
    listen 80;
    server_name ${APP_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${APP_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Заголовки безопасности — здесь, на уровне server, для всех ответов:
    # статики, API и медиафайлов (их отдаёт внутренняя локация /_protected/).
    # add_header в локации отменил бы все унаследованные отсюда, поэтому в
    # локациях своих add_header нет; expires — другая директива, не отменяет.
    # Referrer-Policy — не no-referrer: запросы <img> к /api/v1/media Sanctum
    # узнаёт как запросы своего клиента только по Referer, без него все фото
    # отвечали бы 401.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100m;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Статика `nuxt generate`. Всё, что без хеша в имени (index.html, sw.js,
    # иконки), браузер переспрашивает при каждом открытии (Cache-Control:
    # no-cache, ответ 304 по ETag): после деплоя человек сразу получает новую
    # оболочку и новый service worker. Путь без файла отдаёт index.html —
    # маршруты SPA вроде /people/{id} разбирает клиент. Без `$uri/`: generate
    # кладёт копии оболочки в каталоги страниц (people/index.html), и `$uri/`
    # отвечал бы на /people перенаправлением на /people/.
    location / {
        try_files $uri /index.html;
        expires -1;
    }

    # В mime.types образа nginx нет расширения webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    # Сборка Nuxt: в имени файла хеш содержимого, кешируется на год.
    # Отсутствующий файл — 404, а не index.html: вкладка со старой сборкой
    # должна получить ошибку загрузки модуля, а не HTML вместо JavaScript.
    location /_nuxt/ {
        try_files $uri =404;
        expires 1y;
    }

    # Манифест сборок Nuxt (builds/latest.json) без хеша в имени: по нему
    # открытое приложение узнаёт о новом деплое.
    location /_nuxt/builds/ {
        try_files $uri =404;
        expires -1;
    }

    # Reverb, как и app, может сменить адрес при деплое: DNS — при запросе.
    location /app/ {
        set $reverb_upstream reverb:8080;
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API, CSRF-cookie Sanctum и авторизация каналов уходят в единственный
    # фронт-контроллер Laravel; маршрут Laravel берёт из REQUEST_URI, который
    # внутренняя переадресация не меняет.
    location ~ ^/(api|sanctum|broadcasting)/ {
        rewrite ^ /index.php last;
    }

    # Код PHP есть только в контейнере app, в web его нет. PHP исполняет
    # /app/public/index.php и ничего другого; снаружи /index.php недоступен.
    # Ответы API не сжимаются: сжатие под TLS вместе с секретами в теле ответа
    # (ссылки приглашений) открывает атаку BREACH.
    location = /index.php {
        internal;
        root /app/public;
        gzip off;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
    }

    # Медиафайлы отдаются только внутренней переадресацией из ответа PHP
    # (X-Accel-Redirect: /_protected/{path}); прямой запрос снаружи — 404.
    # /media — том медиафайлов (в web только для чтения) по тому же пути, что
    # и корень диска media в apps/api/config/filesystems.php.
    location /_protected/ {
        internal;
        alias /media/;
    }
}
