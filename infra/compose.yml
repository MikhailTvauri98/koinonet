services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: church
      POSTGRES_USER: church
      POSTGRES_PASSWORD: secret
    volumes: ['pgdata:/var/lib/postgresql/data']
    ports: ['5432:5432']
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ['redisdata:/data']
  app:
    build: { context: ./php }
    environment: &app-environment
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: church
      DB_USERNAME: church
      DB_PASSWORD: secret
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    volumes: ['../apps/api:/app', 'media:/media']
    depends_on: [postgres, redis]
  worker:
    build: { context: ./php }
    command: php artisan horizon
    # От www-data, как рабочие процессы php-fpm в app и воркер в prod: файлы,
    # которые он пишет в том медиафайлов и в storage, принадлежат тому же
    # пользователю, что и загруженные через API (README, «Dev-окружение»).
    user: www-data
    environment: *app-environment
    volumes: ['../apps/api:/app', 'media:/media']
    depends_on: [app]
  web:
    image: nginx:alpine
    volumes:
      - '../apps/api:/app:ro'
      - './nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro'
      # nocopy, как в compose.prod.yml: у образа nginx в /media лежат каталоги
      # alpine (cdrom, floppy, usb), и без него Docker скопировал бы их в пустой
      # том, отдав его корень root, — тогда php-fpm и воркер от www-data не
      # смогли бы записать загрузку. Том заполняет и отдаёт www-data образ app.
      - type: volume
        source: media
        target: /media
        read_only: true
        volume: { nocopy: true }
    ports: ['8080:80']
    depends_on: [app]
volumes: { pgdata: {}, redisdata: {}, media: {} }
