# Продовый стек (docs/architecture.md, раздел 11; установка — docs/deploy.md).
# На сервере лежит в /srv/church рядом с .env и deploy.sh; деплой
# (.github/workflows/deploy.yml) копирует его туда при каждом пуше в main.
# Подстановки берутся из /srv/church/.env: IMAGE_PREFIX, TAG (его пишет
# деплой), APP_DOMAIN, DB_DATABASE, DB_USERNAME, DB_PASSWORD.

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '5' }

# Один образ app для всех ролей PHP, роль — команда запуска. .env целиком
# нужен только им; остальным сервисам передаются отдельные переменные.
# Том медиафайлов нужен и планировщику: media:prune удаляет файлы с диска.
x-php: &php
  image: ${IMAGE_PREFIX:?задайте IMAGE_PREFIX в .env, см. docs/deploy.md}/app:${TAG:?TAG записывает в .env деплой, см. docs/deploy.md}
  env_file: .env
  volumes: ['media:/media']
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped
  logging: *logging

services:
  web:
    image: ${IMAGE_PREFIX:?задайте IMAGE_PREFIX в .env, см. docs/deploy.md}/web:${TAG:?TAG записывает в .env деплой, см. docs/deploy.md}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?задайте APP_DOMAIN в .env}
    ports: ['80:80', '443:443']
    volumes:
      - 'letsencrypt:/etc/letsencrypt:ro'
      - 'certbot-www:/var/www/certbot:ro'
      # nocopy: у образа nginx в /media лежат каталоги alpine (cdrom, floppy,
      # usb). Том медиафайлов заполняет и отдаёт во владение www-data образ app.
      - type: volume
        source: media
        target: /media
        read_only: true
        volume: { nocopy: true }
    depends_on: [app]
    # Здоров, когда через nginx отвечает /api/v1/health: проверяет всю цепочку
    # web → app → postgres и redis. Имя в SNI — домен сайта, иначе запрос
    # попал бы в сервер по умолчанию, который отклоняет рукопожатие. deploy.sh
    # ждёт этого состояния (`up --wait`) и падает, если его нет.
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsk --resolve "$${APP_DOMAIN}:443:127.0.0.1" "https://$${APP_DOMAIN}/api/v1/health" > /dev/null']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
    logging: *logging

  app:
    <<: *php
    # php-fpm принимает соединения: точка входа уже собрала кеши и запустила FPM.
    healthcheck:
      test: ['CMD', 'php', '-r', 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # Образ app наследует от php-fpm сигнал остановки SIGQUIT (мягкая остановка
  # FPM). Horizon его не обрабатывает; по SIGTERM он доделывает текущие задачи
  # и выходит. Задача Horizon живёт не дольше 60 секунд (timeout по умолчанию),
  # запас на остановку — больше, иначе Docker убьёт задачу посреди работы
  # SIGKILL. deploy.sh останавливает worker до переключения, поэтому это
  # ожидание не удлиняет простой app.
  worker:
    <<: *php
    command: ['php', 'artisan', 'horizon']
    stop_signal: SIGTERM
    stop_grace_period: 90s

  scheduler:
    <<: *php
    command: ['php', 'artisan', 'schedule:work']

  # Postgres и Redis закреплены на точной версии и дайджесте: `compose pull` на
  # каждом деплое не подменит образ и не пересоздаст базу. Обновление —
  # осознанной правкой этих строк (docs/deploy.md).
  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${DB_DATABASE:?задайте DB_DATABASE в .env}
      POSTGRES_USER: ${DB_USERNAME:?задайте DB_USERNAME в .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  # Продление сертификата Let's Encrypt: раз в 12 часов `certbot renew`
  # проверяет срок и при необходимости продлевает через webroot — файлы проверки
  # в томе certbot-www, их отдаёт web по HTTP; web сам перечитывает сертификат
  # раз в 12 часов. Первый сертификат выпускается вручную до первого деплоя,
  # пока web не запущен и порт 80 свободен (docs/deploy.md).
  certbot:
    image: certbot/certbot:v5.8.0
    entrypoint: ['/bin/sh', '-c']
    command: ['trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done']
    volumes:
      - 'letsencrypt:/etc/letsencrypt'
      - 'certbot-www:/var/www/certbot'
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata: {}
  redisdata: {}
  media: {}
  letsencrypt: {}
  certbot-www: {}
